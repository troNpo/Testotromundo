name: Deploy PWA to GitHub Pages
on:
push:
branches:
- main
permissions:
contents: write
pages: write
id-token: write
concurrency:
group: "pages"
cancel-in-progress: false
jobs:
deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
steps:
- name: Checkout código
uses: actions/checkout@v4
- name: Inyectar MapTiler API Key
env:
MAPTILER_KEY: ${{ secrets.MAPTILER_API_KEY }}
run: |
if [ -n "$MAPTILER_KEY" ]; then
find . -type f ( -name ".json" -o -name ".html" ) -exec sed -i "s|{{API_KEY}}|$MAPTILER_KEY|g" {} +
echo "API Key inyectada correctamente."
else
echo "Aviso: MAPTILER_API_KEY no definida en los Secrets."
fi
- name: Configurar Pages
uses: actions/configure-pages@v5
- name: Subir artefacto de Pages
uses: actions/upload-pages-artifact@v3
with:
path: '.'
- name: Desplegar a GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
