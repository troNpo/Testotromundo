name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Inyectar API Keys en estilos
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          MAPTILER_TOPO_API_KEY: ${{ secrets.MAPTILER_TOPO_API_KEY }}
          THUNDERFOREST_API_KEY: ${{ secrets.THUNDERFOREST_API_KEY }}
        run: |
          if [ -f "styles/otromundo.json" ]; then
            sed -i "s|{{API_KEY}}|${MAPTILER_API_KEY}|g" styles/otromundo.json
          fi
          if [ -f "styles/otromundotopo.json" ]; then
            sed -i "s|{{TOPO_API_KEY}}|${MAPTILER_TOPO_API_KEY}|g" styles/otromundotopo.json
          fi
          for tf_file in styles/thunderforest-outdoors.json styles/thunderforest-opencyclemap.json; do
            if [ -f "$tf_file" ]; then
              sed -i "s|{{THUNDERFOREST_API_KEY}}|${THUNDERFOREST_API_KEY}|g" "$tf_file"
            fi
          done

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
